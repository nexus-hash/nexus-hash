<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: 2.5px; fill: #FFB454; }
    .summary { font-size: 13px; fill: #8B949E; }
    .owner { font-size: 11px; fill: #8B949E; }
    .repo { font-size: 15px; font-weight: 600; fill: #E6EDF3; }
    .stars { font-size: 12px; font-weight: 600; fill: #FFB454; }
    .more { font-size: 12px; fill: #8B949E; }
    .card { fill: #161B22; stroke: #FFB454; stroke-width: 1; stroke-opacity: .18;
             animation: glow 4.8s ease-in-out infinite; }
    .tile, .fade { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.3,1) forwards; }
    .dot { transform-origin: 28px 31px; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes glow { 0%, 70%, 100% { stroke-opacity: .18; } 35% { stroke-opacity: .85; } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.6); } }
    @media (prefers-reduced-motion: reduce) {
      .tile, .fade, .card, .dot { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#FFB454" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFB454"/>
      <stop offset="1" stop-color="#FFB454" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="divider"><rect x="24" y="50" width="792" height="5"/></clipPath>
  </defs>
  <rect width="840" height="170" rx="16" fill="#0D1117"/>

  <circle class="dot" cx="28" cy="31" r="4" fill="#FFB454"/>
  <text x="40" y="35" class="label">OPEN SOURCE</text>
  <text x="816" y="35" class="summary fade" text-anchor="end">1 merged PR · 1 repo · 1 org</text>
  <rect x="24" y="52" width="792" height="1" fill="#21262D"/>
  <rect x="24" y="51.5" width="140" height="2" fill="url(#sweep)" clip-path="url(#divider)">
    <animate attributeName="x" values="-116;816" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(292,78)">
    <g class="tile" style="animation-delay:0.25s">
      <rect class="card" width="254" height="68" rx="12" style="animation-delay:0.0s"/>
      <clipPath id="logo0"><rect x="14" y="14" width="40" height="40" rx="10"/></clipPath>
      <image href="data:image/png;base64," x="14" y="14" width="40" height="40" clip-path="url(#logo0)"/>
      <text x="68" y="31" class="owner">jupyterlab</text>
      <text x="68" y="51" class="repo">jupyterlab</text>
      <text x="240" y="51" class="stars" text-anchor="end">★ 15.3k</text>
    </g>
  </g>
</svg>
